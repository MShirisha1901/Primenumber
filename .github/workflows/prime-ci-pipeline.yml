name: CI Pipeline

on:
  push:

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Prime Number Application
        run: |
          python src/prime_number.py

      - name: Build Docker Image
        run: |
          docker build -t prime-number:latest .

      - name: Run Docker Container
        run: |
          docker run --name prime-app prime-number:latest
